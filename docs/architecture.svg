<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" role="img" aria-label="KlockUI 运行结构：浏览器 → KlockUI:7861 → ComfyUI:8188 → GPU，模型与预设作为本地资源">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <style>
      .box   { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
      .accent{ fill: #eef6ff; stroke: #79b8ff; stroke-width: 1.5; }
      .t     { fill: #1f2328; font-family: -apple-system,"Segoe UI","Noto Sans SC",sans-serif; }
      .s     { fill: #57606a; font-family: -apple-system,"Segoe UI","Noto Sans SC",sans-serif; }
      .m     { fill: #57606a; font-family: ui-monospace,SFMono-Regular,Consolas,monospace; }
      .line  { stroke: #8b949e; stroke-width: 1.6; fill: none; }
      .dash  { stroke: #8b949e; stroke-width: 1.3; stroke-dasharray: 5 4; fill: none; }
    </style>
  </defs>

  <text class="t" x="24" y="34" font-size="16" font-weight="600">KlockUI 运行结构</text>
  <text class="s" x="24" y="56" font-size="12.5">三个进程都在本机，不含云端调用</text>

  <!-- 主链 -->
  <rect class="box" x="24" y="96" width="164" height="76" rx="10"/>
  <text class="t" x="106" y="126" font-size="13" font-weight="600" text-anchor="middle">浏览器</text>
  <text class="s" x="106" y="147" font-size="11.5" text-anchor="middle">表单界面</text>

  <rect class="accent" x="252" y="84" width="228" height="100" rx="10"/>
  <text class="t" x="366" y="110" font-size="13" font-weight="600" text-anchor="middle">KlockUI · server.py</text>
  <text class="s" x="366" y="131" font-size="11.5" text-anchor="middle">参数 → ComfyUI 节点图</text>
  <text class="s" x="366" y="149" font-size="11.5" text-anchor="middle">任务队列 · 图库 · 预设</text>
  <text class="m" x="366" y="169" font-size="11" text-anchor="middle">:7861</text>

  <rect class="box" x="544" y="96" width="170" height="76" rx="10"/>
  <text class="t" x="629" y="126" font-size="13" font-weight="600" text-anchor="middle">ComfyUI</text>
  <text class="s" x="629" y="147" font-size="11.5" text-anchor="middle">节点图执行</text>
  <text class="m" x="629" y="165" font-size="11" text-anchor="middle">:8188</text>

  <rect class="box" x="778" y="96" width="118" height="76" rx="10"/>
  <text class="t" x="837" y="126" font-size="13" font-weight="600" text-anchor="middle">GPU</text>
  <text class="s" x="837" y="147" font-size="11.5" text-anchor="middle">8–16GB</text>

  <line class="line" x1="190" y1="134" x2="246" y2="134" marker-end="url(#arrow)"/>
  <text class="s" x="218" y="124" font-size="10.5" text-anchor="middle">HTTP</text>

  <line class="line" x1="482" y1="134" x2="538" y2="134" marker-end="url(#arrow)"/>
  <text class="s" x="510" y="124" font-size="10.5" text-anchor="middle">API</text>

  <line class="line" x1="716" y1="134" x2="772" y2="134" marker-end="url(#arrow)"/>

  <!-- 本地资源 -->
  <rect class="box" x="252" y="252" width="228" height="62" rx="10"/>
  <text class="t" x="366" y="278" font-size="12.5" font-weight="600" text-anchor="middle">models/　全部可选</text>
  <text class="s" x="366" y="298" font-size="11" text-anchor="middle">底模 · 编码器 · VAE · LoRA</text>

  <rect class="box" x="504" y="252" width="210" height="62" rx="10"/>
  <text class="t" x="609" y="278" font-size="12.5" font-weight="600" text-anchor="middle">presets/*.json</text>
  <text class="s" x="609" y="298" font-size="11" text-anchor="middle">整套参数，可拖入还原</text>

  <path class="dash" d="M366,188 L366,248" marker-end="url(#arrow)"/>
  <text class="s" x="374" y="232" font-size="10.5">读取</text>

  <path class="dash" d="M452,188 L452,216 L609,216 L609,248" marker-end="url(#arrow)"/>

  <text class="s" x="24" y="286" font-size="11.5">模型与预设都在磁盘上，</text>
  <text class="s" x="24" y="306" font-size="11.5">仓库不含任何权重文件。</text>
  <text class="s" x="24" y="338" font-size="11.5">安装：install.md</text>
  <text class="s" x="24" y="358" font-size="11.5">排错：skill.md</text>
</svg>
